<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self' https://cdn.jsdelivr.net blob:; worker-src blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://*.jsdelivr.net data: blob:; style-src 'self'">
<title>MediMate – Understand your medicines</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main" data-t="skip">Skip to content</a>
<header class="top">
  <div class="logo">💊 MediMate</div>
  <div class="ctl">
    <label class="sr" for="lang">Language</label>
    <select id="lang"><option value="0">English</option><option value="1">తెలుగు</option><option value="2">हिंदी</option></select>
    <button id="aminus" aria-label="Smaller text">A-</button>
    <button id="aplus" aria-label="Larger text">A+</button>
  </div>
</header>
<main id="main">
  <section class="card hero">
    <h1 data-t="title"></h1>
    <p data-t="sub"></p>
    <div id="drop" class="drop" tabindex="0" role="group" aria-label="Photo drop zone">
      <div class="big" data-t="drop"></div>
      <div class="row">
        <button id="camBtn" class="btn" data-t="camera"></button>
        <button id="fileBtn" class="btn alt" data-t="upload"></button>
      </div>
      <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <button id="sample" class="btn sample" data-t="sample"></button>
    <div class="add">
      <label class="sr" for="addin" data-t="addph"></label>
      <input id="addin" list="names" autocomplete="off">
      <datalist id="names"></datalist>
      <button id="addbtn" class="btn alt" data-t="add"></button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
  <section id="results" hidden>
    <div id="next" class="banner"></div>
    <div id="alerts"></div>
    <h2 data-t="medsH"></h2>
    <div id="cards"></div>
    <h2 data-t="chartH"></h2>
    <div id="chart"></div>
    <div class="row actions">
      <button id="print" class="btn" data-t="print"></button>
      <button id="wa" class="btn alt" data-t="share"></button>
      <button id="clear" class="btn ghost" data-t="clear"></button>
    </div>
  </section>
</main>
<footer class="disc"><p data-t="disc"></p></footer>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
